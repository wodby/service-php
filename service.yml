endpoints:
- name: fpm
  ports:
  - name: fpm
    number: 9000
    main: true
    protocol: tcp

build:
  dockerfile: Dockerfile
  connect: true
  boilerplates:
  - name: composer
    title: Composer boilerplate
    repo: https://github.com/wodby/php-package-boilerplate
    branch: master

links:
- name: db
  title: DBMS
  required: false
  # A managed database server's CA certificate, mounted when the server has one, so the app can verify it over TLS.
  database:
    ca:
      filepath: /etc/wodby/db/ca.pem
  env:
  - name: DB_HOST
    value: '{{link.database.host}}'
  - name: DB_PORT
    value: '{{link.database.port}}'
  - name: DB_USERNAME
    value: '{{link.database.user.name}}'
  - name: DB_NAME
    value: '{{link.database.db.name}}'
  - name: DB_DATABASE
    value: '{{link.database.db.name}}'
  - name: DB_PASSWORD
    value: '{{link.database.user.password}}'
    secret: true
  - name: DB_DRIVER
    value: '{{link.database.driver}}'
  - name: DB_CONNECTION
    value: '{{link.database.driver}}'
  # The path of the server's CA certificate when it has one, otherwise empty: connect with TLS only when it is set.
  - name: DB_SSL_CA
    value: '{{link.database.caFile}}'
  selectors:
  - type: db
    labels:
    - mariadb
  - type: db
    labels:
    - mysql
  - type: db
    labels:
    - postgres
- name: sendmail
  title: Mail Transfer Agent
  required: false
  env:
  - name: MSMTP_HOST
    value: '{{link.host}}'
  - name: MSMTP_PORT
    value: '{{link.port}}'
  selectors:
  - type: service
    labels:
    - smtpd
- name: otel
  title: OpenTelemetry Collector
  required: false
  env:
  - name: OTEL_EXPORTER_OTLP_ENDPOINT
    value: 'http://{{link.host}}:{{link.port}}'
  - name: OTEL_EXPORTER_OTLP_PROTOCOL
    value: http/protobuf
  - name: OTEL_EXPORTER_OTLP_HEADERS
    value: 'Authorization=Bearer%20{{link.tokens.ingest_token}}'
    secret: true
  # Lets the OpenTelemetry PHP SDK, when the application installs it with Composer, configure itself from these
  # variables. It has no effect without the SDK.
  - name: OTEL_PHP_AUTOLOAD_ENABLED
    value: 'true'
  selectors:
  - type: service
    labels:
    - otlp

integrations:
- name: variable
  title: Variable
  type: variable
  required: false
  multiple: true
  providers:
  - name: newrelic
    env:
    - name: PHP_NEWRELIC_LICENSE
      value: '{{integration.variables.NEWRELIC_LICENSE}}'
      secret: true
    - name: PHP_NEWRELIC_APPNAME
      value: '{{app.name}}'

deployment:
  strategy: rolling
  maxUnavailable: 0
  maxSurge: 1
  minReady: 10s
  progressDeadline: 15m
  shutdownGracePeriod: 30s

helm:
  name: wodby
  source: oci://registry-1.docker.io/wodby/php-fpm
  chart: oci://registry-1.docker.io/wodby/php-fpm
  version: 0.3.3
  valueMappings:
    serviceAccountName: serviceAccount.name
    serviceAccountCreate: serviceAccount.create

workloads:
- name: main
  selector:
    matchLabels:
      app.kubernetes.io/instance: '{{helm.release}}'
  kind: deployment
  primary: true
  helm:
    labels: podLabels
    annotations: podAnnotations
    volumes: extraVolumes
    sidecars: sidecars
  containers:
  - name: php
    image: wodby/php
    resources:
      request:
        cpu: 20
        memory: 80
    build: true
    env:
    - name: PHP_FPM_CLEAR_ENV
      value: 'no'
    - name: PHP_ERROR_REPORTING
      value: 'E_ALL & ~E_DEPRECATED & ~E_STRICT'
      envType: prod
    - name: PHP_DISPLAY_ERRORS
      value: 'Off'
      envType: prod
    - name: PHP_DISPLAY_STARTUP_ERRORS
      value: 'Off'
      envType: prod
    - name: PHP_TRACK_ERRORS
      value: 'Off'
      envType: prod
    helm:
      resources: resources
      env: envVars
      mounts: extraVolumeMounts

# Development workspaces use the runtime image's PHP, Composer, Git and SSH tools.
workspace:
  configuration: [/docker-entrypoint.sh, --configure-runtime]
  runner:
    workload: main
    container: php
    workingDirectory: /var/www/html
    homeDirectory: /home/wodby
    username: wodby
    uid: 1000
    gid: 1000
    port: 2222
    command: [sudo, /usr/sbin/sshd, -D, -e, -f, /dev/null]
  mounts:
  - name: code
    workload: main
    container: php
    path: /var/www/html
  preparation:
  - name: dependencies
    command: [/bin/sh, -eu, -c, 'if [ -f composer.json ]; then composer install --no-interaction --prefer-dist; fi']
    timeoutSeconds: 1800
  # Keeps Composer dependencies out of Git status.
  ignore: ['/vendor/']
  reload: immediate
